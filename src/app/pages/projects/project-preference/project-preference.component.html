        <button (click)="item0.toggleItem()" [collapsed]="!item0.visible" cAccordionButton>
          General Settings

      </ng-template>

      <ng-template cTemplateId="accordionBodyTemplate">
        <div class="accordion-body">
          <form *ngIf="generalSettingForm" [formGroup]="generalSettingForm">
            <div class="d-flex justify-content-between align-items-start mb-3">

                <div class="col-md-6">

                  <ng-container *ngIf="!isGeneralEditMode; else editName">
                    <p class="field-value" style="word-break: break-all;">{{ projectNameControl.value }}</p>

                  <ng-template #editName>
                    <input formControlName="projectName" class="form-control" placeholder="Enter project name" />
                    <small class="text-danger mt-1"
                      *ngIf="generalSettingForm.get('projectName')?.hasError('maxlength')">
                      Maximum 40 characters allowed.
                    </small>
                  </ng-template>
                </div>

                <div class="col-md-6">
                  <p class="field-label">Description</p>
                  <ng-container *ngIf="!isGeneralEditMode; else editDesc">
                    <p class="field-value" style="word-break: break-all;">{{ descriptionControl.value }}</p>
                  </ng-container>
                  <ng-template #editDesc>
                    <textarea formControlName="description" class="form-control" rows="3"
                      placeholder="Enter description"></textarea>
                  </ng-template>
                </div>

              </div>

                  <i class="bi bi-pencil-square edit-icon"></i>
                </button>
                <button *ngIf="isGeneralEditMode" class="btn btn-sm border border-2 border-black text-black"
                  (click)="saveGeneralChanges()">
                  Save
                </button>
              </div>
            </div>


          </form>
        </div>
      </ng-template>
    </c-accordion-item>
  </c-accordion>

  <c-accordion class="accordion-gap mb-4">
    <c-accordion-item #item2="cAccordionItem" [visible]="true">
      <ng-template cTemplateId="accordionHeaderTemplate">
        <button (click)="item2.toggleItem()" [collapsed]="!item2.visible" cAccordionButton>
          Environments
        </button>
      </ng-template>
      <ng-template cTemplateId="accordionBodyTemplate">
        <div class="accordion-body environment-list my-2">
          <table class="table ">
            <thead>
              <tr>
                <th>Name</th>
                <!-- <th *ngIf="!isBusiness">Resource Limit</th> -->
                <th>Region</th>
                <th style="width: 100px;"></th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let env of environments; let i = index">
                <td>{{ env.name }}</td>
                <!-- <td [innerHTML]="env.resourceLimit" *ngIf="!isBusiness"></td> -->
                <td>{{ env.region }}</td>
                <td class="text-end position-relative">
                  <div class="custom-dropdown d-inline-block" (click)="toggleDropdown(env, $event)">
                    <button class="btn btn-icon" type="button">
                      <i class="bi bi-three-dots-vertical"></i>
                    </button>
                    <ul *ngIf="activeEnv === env" class="custom-dropdown-menu">
                      <li (click)="onActionSelected('view', env)">
                        <a class="custom-dropdown-item">View / Edit</a>
                      </li>
                      <li (click)="onActionSelected('delete', env)">
                        <a class="custom-dropdown-item">Delete</a>
                      </li>
                    </ul>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>

          <ng-container *ngIf="environments.length === 0">
            <p class="text-muted">No environments found.</p>
          </ng-container>
        </div>
      </ng-template>
    </c-accordion-item>
  </c-accordion>

  <c-accordion class="accordion-gap  mb-4">
    <c-accordion-item #item5="cAccordionItem" [visible]="true">

      <ng-template cTemplateId="accordionHeaderTemplate">
        <button (click)="item5.toggleItem()" [collapsed]="!item5.visible" cAccordionButton>
          Integrations
        </button>
      </ng-template>

      <ng-template cTemplateId="accordionBodyTemplate">
        <div class="accordion-body">
          <div class="row g-3">
            <div class="col-md-6" *ngFor="let integration of integrations">
              <div class="border rounded p-3 d-flex align-items-center justify-content-between"
                [ngClass]="{ 'border-primary': integration.selected }">
                <div class="d-flex align-items-center">
                  <img [src]="integration.logo" alt="Logo" width="40" height="40" class="me-2" />
                  <div>
                    <strong>{{ integration.name }}</strong><br />
                    <small class="text-capitalize"
                      [ngClass]="integration.status ==='connected'?'text-success' : 'text-danger'">{{ integration.status
                      }}</small>
                  </div>
                </div>

                <ng-container *ngIf="integration.status === 'connected'; else connectBtn">
                  <button class="btn btn-outline-danger btn-sm"
                    (click)="diconnectProfile(integration.name)">Disconnect</button>
                </ng-container>

                <ng-template #connectBtn>
                  <button class="btn btn-outline-success btn-sm"
                    (click)="getProfile(integration.provider)">Connect</button>
                </ng-template>
              </div>
            </div>

            <!-- <div class="col-md-6">
              <div class="border border-dashed rounded d-flex align-items-center justify-content-center p-3"
                style="height: 80px;">
                <span class="text-muted">+ Add new integration</span>
              </div>
            </div> -->
          </div>
        </div>
      </ng-template>

    </c-accordion-item>
  </c-accordion>

  <div class="d-flex justify-content-between align-items-center border-top pt-3 mb-4">
    <button class="btn button-format-outline" routerLink="/projects">
      &#8592; Projects
    </button>
  </div>
</div>

<app-modal #editEnvironmentsModel [modalConfig]="editEnvironmentsModelConfig">

  <div class="container">
    <form [formGroup]="environmentForm">
      <div class="mt-2">
        <label for="environmentName">Environment Name
          <span class="cursor" title="{{nameValidation}}"><i class="bi bi-info-circle"></i>
          </span>
        </label>
      </div>
      <div class="mt-2">
        <input class="form-control" type="text" formControlName="envName">
      </div>
      <div *ngIf="environmentForm.get('envName')?.hasError('invalidName') && environmentForm.get('envName')?.touched"
        class="text-danger right-text">
        Environment name is invalid
      </div>
      <div class="mt-4 text-right">
        <button type="submit" class="btn btn-dark mx-2 px-3 py-1" (click)="updateEnvironment()"
          [disabled]="environmentForm.invalid" id="updateButton">Update</button>
        <button class="btn btn-secondary mx-2 px-3 py-1" (click)="closeModal()" aria-label="Cancel">Cancel</button>
      </div>
    </form>
  </div>

</app-modal>
