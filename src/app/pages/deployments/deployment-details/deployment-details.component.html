<div class="container">
  <c-nav variant="underline-border">
    <c-nav-item>
      <a [cTabContent]="tabContent1"  (click)="onTabChange(0)"[tabPaneIdx]="0" cNavLink class="px-4 py-2">
        Releases
      </a>
    </c-nav-item> 
    <c-nav-item (click)="onTabChange(1)">
      <a [cTabContent]="tabContent1" [tabPaneIdx]="1" cNavLink class="px-4 py-2">
        Environment Variables
      </a>
    </c-nav-item>
    <c-nav-item (click)="onTabChange(2)">
      <a [cTabContent]="tabContent1" [tabPaneIdx]="2" cNavLink class="px-4 py-2">
        Secrets
      </a>
    </c-nav-item>
    <c-nav-item (click)="onTabChange(3)"> 
      <a [cTabContent]="tabContent1" [tabPaneIdx]="3" cNavLink class="px-4 py-2">
        Code as config
      </a>
    </c-nav-item>
    <c-nav-item (click)="onTabChange(4)">
      <a [cTabContent]="tabContent1" [tabPaneIdx]="4" cNavLink class="px-4 py-2">
        Settings
      </a>
    </c-nav-item>
    <c-nav-item (click)="onTabChange(5)">
      <a [cTabContent]="tabContent1" [tabPaneIdx]="5" cNavLink class="px-4 py-2">
        Application logs
      </a>
    </c-nav-item>
    <c-nav-item (click)="onTabChange(6)">
      <a [cTabContent]="tabContent1" [tabPaneIdx]="6" cNavLink class="px-4 py-2">
        Metrics
      </a>
    </c-nav-item>
    <c-nav-item (click)="onTabChange(7)">
      <a [cTabContent]="tabContent1" [tabPaneIdx]="7" cNavLink class="px-4 py-2">
        Networking
      </a>
    </c-nav-item>
  </c-nav>
  <c-tab-content #tabContent1="cTabContent" [activeTabPaneIdx]="selectedTabIndex" cRounded="bottom">
    <c-tab-pane class="p-3 preview" role="tabpanel" >
      <app-deployment-releases  [currentStatus]="lastReleaseData[0]?.status" [deploymentdetails]="deploymentdetails"
      ></app-deployment-releases>
    </c-tab-pane>

    <c-tab-pane class="p-3 preview" role="tabpanel">
      <app-environment-variables [canAddVariables]="true" [currentStatus]="lastReleaseData[0]?.status"></app-environment-variables>
    </c-tab-pane>

    <c-tab-pane class="p-3 preview" role="tabpanel">
      <app-deployment-secrets [canAddVariables]="true" [currentStatus]="lastReleaseData[0]?.status"></app-deployment-secrets>
    </c-tab-pane>
    <c-tab-pane class="p-3 preview" role="tabpanel">
      <app-deployment-config-maps [currentStatus]="lastReleaseData[0]?.status"></app-deployment-config-maps>
    </c-tab-pane>

    <c-tab-pane class="p-3 preview" role="tabpanel">
      <app-deployment-settings (closeModalEvent)="closeModalEvent.emit()" [currentStatus]="lastReleaseData[0]?.status"></app-deployment-settings>
    </c-tab-pane>
    <c-tab-pane class="p-3 preview" role="tabpanel">
      <ng-container *ngIf="appName">
        <app-deployment-observability (closeModalEvent)="closeModalEvent.emit()" [appName]="appName"></app-deployment-observability>
      </ng-container>
    </c-tab-pane>

    <c-tab-pane class="p-3 preview" role="tabpanel">
      <app-deployment-metrics (closeModalEvent)="closeModalEvent.emit()"></app-deployment-metrics>
    </c-tab-pane>
    <c-tab-pane class="p-3 preview" role="tabpanel">
      <app-deployment-networking (closeModalEvent)="closeModalEvent.emit()" [currentStatus]="lastReleaseData[0]?.status"></app-deployment-networking>
    </c-tab-pane>
  </c-tab-content>
  <div class="d-flex justify-content-between " *ngIf="selectedTabIndex > 0">
    <button class="btn button-format-outline  mt-3" (click)="goBack()"> <i class="bi bi-arrow-left"></i>
      Deployments</button>
    <button class="btn button-format-solid mt-3" (click)="goToNextTab()" *ngIf="selectedTabIndex < 4" [disabled]="lastReleaseData[0]?.status === 'Building' " [attr.title]="(lastReleaseData[0]?.status === 'Building') ? 'You are not authorized to view that page.' : null">Save & Continue</button>
  </div>
</div>
