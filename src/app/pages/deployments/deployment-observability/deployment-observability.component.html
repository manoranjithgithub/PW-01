  <div class="ms-auto theme-toggle d-flex justify-content-end p-2 mt-2">
    <span class="switch-label">Switch mode</span>
    <label class="switch">
      <input type="checkbox" [checked]="isLightMode" (change)="toggleMode($event)">
      <span class="slider">
        <i class="bi bi-moon icon-moon"></i>
        <i class="bi bi-sun icon-sun"></i>
      </span>
    </label>
  </div>
<form [formGroup]="filterForm" (ngSubmit)="onFilter()"
  class="filter-bar d-flex align-items-end gap-3 p-3 border rounded flex-wrap w-100">
  <div class="form-group mb-0">
    <label class="custom-label">Search by keyword</label>
    <input type="text" class="form-control custom-values" placeholder="Search..." formControlName="searchText" />
  </div>

  <div class="form-group mb-0">
    <label for="duration" class="custom-label">Time Duration:</label>
    <select id="duration" formControlName="duration" class="form-control  custom-values">
      <option *ngFor="let duration of durations" [value]="duration.value">
        {{ duration.label }}
      </option>
    </select>
  </div>

  <ng-container *ngIf="filterForm.get('duration')?.value === 'custom'">
    <div class="d-flex align-items-end gap-3">
      <div class="form-group mb-0">
        <label class="custom-label">From:</label>
        <input type="datetime-local" formControlName="fromTimestamp" class="form-control custom-values" />
      </div>

      <div class="form-group mb-0">
        <label class="custom-label">To:</label>
        <input type="datetime-local" formControlName="toTimestamp" class="form-control custom-values" />
      </div>
    </div>
  </ng-container>

  <div class="form-group mb-0">
    <button type="submit" class="btn btn-primary p-2 custom-label">Apply Filter</button>
  </div>

  <div class="ms-auto mb-0">
    <button type="button" class="btn btn-outline-secondary" (click)="onRefresh()">
      <i class="bi bi-arrow-clockwise"></i>
    </button>
  </div>
</form>

<hr>

<div class="log-container" [ngClass]="isLightMode ? 'log-container-light' : 'log-container-dark'">
  <table class="log-table">
    <thead>
      <tr>
        <th>Timestamp</th>
        <th>Message</th>
      </tr>
    </thead>
  </table>
  <div class="log-body" id="logContainer">
    <table class="log-table">
      <tbody>
        <tr *ngIf="filteredLogs.length === 0">
          <td colspan="2" style="text-align: center;">No logs available</td>
        </tr>
        <tr *ngFor="let log of filteredLogs">
          <td style="width:30%">{{ log.timestamp }}</td>
          <td style="width:70%" [innerHTML]="log.message | highlight:filterForm.get('searchText')?.value"></td>
        </tr>
      </tbody>
    </table>

  </div>

</div>
<div *ngIf="totalItems > 0" class="pagination d-flex justify-content-between gap-3 my-4">
  <nav>
    <ul class="pagination justify-content-center align-items-center">
      <li class="page-item" [class.disabled]="currentPage === 1">
        <button class="page-link" (click)="onPageChange(currentPage - 1)">Prev</button>
      </li>
      <li class="page-item" *ngIf="pages[0] > 1">
        <button class="page-link" (click)="onPageChange(1)">1</button>
      </li>
      <li class="page-item" *ngIf="pages[0] > 2">
        <span class="page-link">…</span>
      </li>
      <li class="page-item" *ngFor="let page of pages" [class.active]="currentPage === page">
        <button class="page-link" (click)="onPageChange(page)">{{ page }}</button>
      </li>
      <li class="page-item" *ngIf="pages[pages.length - 1] < totalItems - 1">
        <span class="page-link">…</span>
      </li>
      <li class="page-item" *ngIf="pages[pages.length - 1] < totalItems">
        <button class="page-link" (click)="onPageChange(totalItems)">{{ totalItems }}</button>
      </li>
      <li class="page-item" [class.disabled]="currentPage === totalItems">
        <button class="page-link" (click)="onPageChange(currentPage + 1)">Next</button>
      </li>

    </ul>
  </nav>

  <label class="d-flex align-items-center justify-content-between gap-2">
    <span class="form-label page-options">Page Size:</span>
    <select [(ngModel)]="itemsPerPage" (change)="onChangePageSize($event)"
      class="form-select form-select-sm page-options">
      <option *ngFor="let page of pageSizes" [value]="page">{{ page }}</option>
    </select>
  </label>
</div>
