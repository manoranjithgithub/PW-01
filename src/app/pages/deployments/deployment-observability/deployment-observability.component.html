<form [formGroup]="filterForm" class="filter-bar d-flex align-items-end gap-3 px-3 w-100 mb-0">
  <div class="form-group">
    <label class="custom-label">Search by keyword</label>
    <input type="text" class="form-control custom-values" placeholder="Search..." formControlName="searchText" />
  </div>

  <div class="form-group">
    <label for="duration" class="custom-label">Time Duration:</label>
    <select id="duration" formControlName="duration" class="form-control custom-values" (change)="onDurationSelect($event)">
      <option *ngFor="let duration of durations" [value]="duration?.value">
        {{ duration?.label }}
      </option>
    </select>
  </div>

  <div class="form-group">
    <label for="timeZone" class="custom-label">Time Zone:</label>
    <select id="timeZone" formControlName="timeZone" class="form-select custom-values" (change)="onTimeZoneSelect()">
      <option *ngFor="let tz of timeZones" [value]="tz?.value">{{ tz?.label }}</option>
    </select>
  </div>

  <ng-container *ngIf="filterForm.get('duration')?.value === 'custom'">
    <app-date-range-picker
      [fromTimestamp]="filterForm.value.fromTimestamp"
      [toTimestamp]="filterForm.value.toTimestamp"
      (apply)="onCustomRangeApplied($event)">
    </app-date-range-picker>
  </ng-container>

  <div class="form-group log-actions d-flex align-items-end gap-2 justify-content-between">
    <!-- <button type="button" class="btn btn-outline-secondary" (click)="onRefresh()" title="Refresh Logs">
      <i class="bi bi-arrow-clockwise"></i>
    </button> -->
    <!-- <div class="refresh-interval-field">
      <label class="custom-label">Refresh</label>
      <select class="form-select custom-values refresh-interval-select"
        [ngModel]="selectedRefreshInterval"
        [ngModelOptions]="{ standalone: true }"
        (change)="onRefreshIntervalChange($event)"
        title="Auto refresh interval">
        <option *ngFor="let interval of refreshIntervals" [value]="interval?.value">{{ interval?.label }}</option>
      </select>
    </div> -->
    <button type="button" class="btn btn-outline-secondary" (click)="onRefresh()" title="Refresh Logs">
      <i class="bi bi-arrow-clockwise"></i>
    </button>
    <button type="button" class="btn btn-outline-secondary" (click)="onDownloadLogs()" title="Export Logs">
      <i class="bi bi-download"></i>
    </button>
  </div>

  <div class="ms-auto mb-0">
    
    <div class="ms-auto theme-toggle d-flex justify-content-end p-2 mt-2">
      <span class="switch-label">Switch mode</span>
      <label class="switch">
        <input type="checkbox" [checked]="isLightMode" (change)="toggleMode($event)">
        <span class="slider">
          <i class="bi bi-moon icon-moon"></i>
          <i class="bi bi-sun icon-sun"></i>
        </span>
      </label>
    </div>
  </div>
</form>

<hr>

<div class="log-container" [class.dark]="!isLightMode" [class.light]="isLightMode">
  <table class="log-table">
    <thead>
      <tr>
        <th class="col-timestamp">Timestamp</th>
        <th>Message</th>
      </tr>
    </thead>
  </table>
  <div class="terminal-wrapper">
    <table class="terminal-table">
      <tbody>
        <tr *ngIf="filteredLogs.length === 0">
          <td colspan="2" class="empty-log">No logs available</td>
        </tr>

        <tr *ngFor="let log of filteredLogs">
          <td class="timestamp col-timestamp">
            {{ log.timestamp}}
          </td>
          <td class="message" [ngClass]="getLogClass(log.message)"
            [innerHTML]="log.message | highlight:filterForm.get('searchText')?.value">
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div *ngIf="totalItems > 0" class="pagination d-flex justify-content-between gap-3 my-4">
  <nav>
    <ul class="pagination justify-content-center align-items-center">
      <li class="page-item" [class.disabled]="currentPage === 1">
        <button class="page-link" (click)="onPageChange(currentPage - 1)">Prev</button>
      </li>
      <li class="page-item" *ngIf="pages[0] > 1">
        <button class="page-link" (click)="onPageChange(1)">1</button>
      </li>
      <li class="page-item" *ngIf="pages[0] > 2">
        <span class="page-link">…</span>
      </li>
      <li class="page-item" *ngFor="let page of pages" [class.active]="currentPage === page">
        <button class="page-link" (click)="onPageChange(page)">{{ page }}</button>
      </li>
      <li class="page-item" *ngIf="pages[pages.length - 1] < totalItems - 1">
        <span class="page-link">…</span>
      </li>
      <li class="page-item" *ngIf="pages[pages.length - 1] < totalItems">
        <button class="page-link" (click)="onPageChange(totalItems)">{{ totalItems }}</button>
      </li>
      <li class="page-item" [class.disabled]="currentPage === totalItems">
        <button class="page-link" (click)="onPageChange(currentPage + 1)">Next</button>
      </li>

    </ul>
  </nav>

  <label class="d-flex align-items-center justify-content-between gap-2">
    <span class="form-label page-options">Page Size:</span>
    <select [(ngModel)]="itemsPerPage" (change)="onChangePageSize($event)"
      class="form-select form-select-sm page-options">
      <option *ngFor="let page of pageSizes" [value]="page">{{ page }}</option>
    </select>
  </label>
</div>
