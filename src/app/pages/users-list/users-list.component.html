<ng-container *ngIf="showAddUserSection">
    <label class="title mb-1">Add New User</label>
    <div class="card mb-3 border">
        <div class="card-body pb-0">
            <form [formGroup]="addUserForm" (ngSubmit)="onSubmitAddUser()" class="mb-0">
                <div class="d-flex gap-2 my-2 justify-content-between">
                    <div class="form-group w-100">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" formControlName="username" class="form-control"
                            placeholder="Username *" required />
                        <div *ngIf="addUserForm.get('username')?.touched && addUserForm.get('username')?.invalid"
                            class="text-danger">
                            <small *ngIf="addUserForm.get('username')?.errors?.['required']">Username is
                                required.</small>
                        </div>
                        <div *ngIf="
                    addUserForm.get('username')?.hasError('pattern') &&
                    (addUserForm.get('username')?.touched ||
                      addUserForm.get('username')?.dirty)
                  " class="text-danger mt-1">
                            Username may only contain alphanumeric characters, underlines or hyphens, cannot have
                            consecutive
                            hyphens or underlines, and cannot begin or end with a hyphen or underline.
                        </div>
                    </div>
                    <div class="form-group w-100">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" formControlName="email" class="form-control"
                            placeholder="Email *" required />
                        <div *ngIf="addUserForm.get('email')?.touched && addUserForm.get('email')?.invalid"
                            class="text-danger">
                            <small *ngIf="addUserForm.get('email')?.errors?.['required']">Email is required.</small>
                            <small *ngIf="addUserForm.get('email')?.errors?.['email']">Enter a valid email.</small>
                        </div>
                    </div>
                </div>
                <div class="d-flex gap-2 my-2 justify-content-between">
                    <div class="form-group w-100">
                        <label for="email" class="form-label">Select Project</label>
                        <select formControlName="project" id="project" class="form-select">
                            <option *ngIf="!projectList || projectList.length === 0" disabled >
                                No project available
                            </option>
                            <option *ngFor="let option of projectList" [value]="option.id">
                                {{ option.name }}
                            </option>
                        </select>
                    </div>
                    <div class="form-group w-100">
                        <label for="email" class="form-label">Select Environment</label>
                        <select formControlName="environment" id="environment" class="form-select">
                            <option *ngIf="!envList || envList.length === 0" disabled >
                                No environment available
                            </option>
                            <option *ngFor="let option of envList" [value]="option.id">
                                {{ option.name }}
                            </option>
                        </select>
                    </div>
                    <div class="form-group w-100">
                        <label for="email" class="form-label">Select Access</label>
                        <select formControlName="access" id="access" class="form-select">
                            <option *ngFor="let option of availableAccess" [value]="option.value">
                                {{ option.text }}
                            </option>
                        </select>
                    </div>
                </div>
                <div class="text-right mt-4">
                    <button type="reset" class="btn button-format-outline me-2" (click)="resetForm()">
                        Cancel
                    </button>
                    <button type="submit" class="btn button-format-solid" [disabled]="addUserForm.invalid">
                        Add User
                    </button>
                </div>
            </form>
        </div>
    </div>
</ng-container>
<div class="container">
    <app-ag-grid-table [rowData]="tableData" [columnDefs]="columnDefs" [showProjectButton]="false"
        [showDeployButton]="false" [showAddUser]="!showAddUserSection"
        (addUuserEvent)="addnewUser($event)"></app-ag-grid-table>
</div>
