<ng-container *ngIf="viewdata as vd">
  <ng-container *ngIf="(vd.data || vd) as data">
    <div class="d-flex justify-content-between gap-3 w-100 my-2">
      <fieldset class="my-2 w-100 border p-4 shadow-sm rounded">
        <div class="custom-heading">Public Networking</div>
        <div class="custom-content">Access this service publicly through HTTP/TCP.</div>

        <div class="my-4">
          <label for="publicHost" class="font-bold">Endpoint</label>
          <div class="input-group">
            <input type="text" class="form-control custom-values"
              [value]="data.publicHost ? (data.publicHost) : 'Endpoint not available'" name="publicHost" readonly>
            <button class="btn btn-outline-secondary" type="button" title="Copy domain"
              (click)="data.publicHost ? copy(data.publicHost) : null" [disabled]="!data.publicHost">
              <i class="bi bi-clipboard"></i>
            </button>
            <button class="btn btn-outline-secondary" type="button" title="Delete"
              (click)="data.publicHost ? clearPublicHost() : null" [disabled]="!data.publicHost">
              <i class="bi bi-trash"></i>
            </button>
            <!-- <button class="btn" title="Open domain" (click)="data.publicHost ? open(data.publicHost) : null" [disabled]="!data.publicHost"> <i class="bi bi-box-arrow-up-right"></i></button> -->
            <button *ngIf="!data.publicHost && allowGenerate" class="btn btn-primary ms-1"
              (click)="requestGenerate()">Generate host</button>
          </div>
        </div>
        <div class="ports-section">
          <div class="port-box" *ngIf="data.publicPort">
            <div class="port-label">Public Port</div>
            <div class="port-value"> {{ data.publicPort }}</div>
          </div>
        </div>
      </fieldset>

      <fieldset class="my-2 w-100 border p-4 shadow-sm rounded">
        <div class="custom-heading">Private Networking</div>
        <div class="custom-content">Access this service from within the network.</div>
        <div class="my-4">
          <label for="privateHost" class="font-bold">Endpoint</label>
          <div class="input-group">

            <input type="text" class="form-control" placeholder="Enter a host name" [disabled]="true"
              [value]="data.privateHost ? (data.privateHost) : (data.name)">

            <button class="btn btn-outline-secondary" type="button" title="Copy domain"
              (click)="copy(data.privateHost ? (data.privateHost) : (data.name))">
              <i class="bi bi-clipboard"></i>
            </button>
            <!-- <button class="btn btn-outline-secondary" title="Open domain"
                (click)="open(data.privateHost ? ('http://' + data.privateHost) : ('http://' + data.name))"> <i
                  class="bi bi-box-arrow-up-right"></i></button> -->
          </div>
        </div>
        <div class="ports-section">
          <div class="port-box" *ngIf="data.privatePort">
            <div class="port-label">Private Port</div>
            <div class="port-value"> {{ data.privatePort }}</div>
          </div>
        </div>
      </fieldset>
    </div>

    <!-- <div *ngIf="data.publicPort || data.privatePort || data.port" class="my-3">
      <div class="custom-heading">Ports</div>
      <div class="custom-content">
        <div *ngIf="data.publicPort">Public Port: {{ data.publicPort }}</div>
        <div *ngIf="data.privatePort">Private Port: {{ data.privatePort }}</div>
        <div *ngIf="data.port && !(data.publicPort || data.privatePort)">Port: {{ data.port }}</div>
      </div>
    </div> -->
  </ng-container>
</ng-container>
