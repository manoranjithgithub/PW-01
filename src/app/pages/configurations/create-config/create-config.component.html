<div class="container mt-2">
    <div class="d-flex justify-content-space-between">
        <span class="cursor arrow-alignment" (click)="goToBack()"><i class="bi bi-arrow-left"></i> Back</span>
        <div class="d-flex justify-content-end right-control">
            <div class="my-2 mx-2" *ngIf="isView">
                <button class="btn btn-primary px-4" (click)="enableForm()"><i class="bi bi-pencil"></i> Edit</button>
            </div>
            <div class=" my-2" *ngIf="isView">
                <button class="btn btn-warning px-4" (click)="openConfirmationDialog()"><i class="bi bi-trash"></i> Delete</button>
            </div>
        </div>
    </div>
    <c-card-group>
        <c-card class="p-4">
            <c-card-body>
                <form cForm [formGroup]="form" (ngSubmit)="onSubmit()">
                    <div class="d-flex gap-3">
                        <div class="flex-fill mb-3">
                            <label for="name">Name:</label>
                            <input id="name" formControlName="name" class="form-control"/>
                        </div>
                    </div>

                    <div formArrayName="data">
                        <div *ngFor="let item of data.controls; let i = index" [formGroupName]="i" class="mb-2">
                            <div class="d-flex gap-3">
                                <div class="flex-fill mb-3">
                                    <label>Key:</label>
                                    <input formControlName="key" class="form-control" autocomplete="off"/>
                                </div>

                                <div class="flex-fill">
                                    <label>Value:</label>
                                    <div class="input-group">
                                        <input [attr.type]="getInputType(item)" formControlName="value"
                                            class="form-control" autocomplete="new-password"/>
                                        <span class="input-group-addon"><i class="positioning glyphicon bi"
                                                [ngClass]="getClass(item)" (click)="toggleVisibility(item)"
                                                *ngIf="!isView"></i></span>
                                    </div>
                                </div>

                                <button type="button" class="btn text-danger" (click)="removeData(i)" *ngIf="!isView"><i
                                        class="bi bi-trash"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="text-right" *ngIf="!isView">
                        <button type="button" class="btn btn-success text-white small" (click)="addData()">Add new
                            key</button>
                    </div>
                    <div class="text-right my-3" *ngIf="!isView">
                        <button type="submit" class="btn btn-primary w-20">Submit</button>
                    </div>

                </form>
            </c-card-body>
        </c-card>
    </c-card-group>
    <app-loader></app-loader>
</div>
