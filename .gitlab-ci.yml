stages:
  - code-quality-check
  - build
  - deploy

es-lint:
  stage: code-quality-check
  image: node:22.1.0
  script:
    - npm install --only-dev --legacy-peer-deps
    - npx eslint '**/*.js' --max-warnings=0
  allow_failure: true

sonarqube:
  stage: code-quality-check
  image: node:22.1.0
  script:
    - npm install --only-dev --legacy-peer-deps
    - node sonar.js $SONAR_HOST_URL $SONAR_TOKEN
  allow_failure: true

build:
  stage: build
  image: docker:20.10.16
  services:
    - name: docker:20.10.16-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://localhost:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo $CI_REGISTRY
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t registry.dilligentech.com/dt/paas/nimbuz-portal-fe:dev --build-arg ENV=dev .
    - docker push registry.dilligentech.com/dt/paas/nimbuz-portal-fe:dev
  only:
    - dev

image-release:
  stage: build
  image: docker:20.10.16
  services:
    - name: docker:20.10.16-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://localhost:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo $CI_REGISTRY
    - apk add jq
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t registry.dilligentech.com/dt/paas/nimbuz-portal-fe:$(jq .version package.json -r) --build-arg ENV=prod .
    - docker push registry.dilligentech.com/dt/paas/nimbuz-portal-fe:$(jq .version package.json -r)
  only:
    - main

deploy:
  stage: deploy
  image: ubuntu:latest
  script:
    - apt update -y && apt install wget curl -y
    - wget https://get.helm.sh/helm-v3.15.0-linux-amd64.tar.gz
    - tar -xvzf helm-v3.15.0-linux-amd64.tar.gz
    - mv linux-amd64/helm /usr/bin/
    - rm -rf linux-amd64
    - helm repo add --username $HELM_REGISTRY_USER --password $HELM_REGISTRY_TOKEN dt-charts ${CI_API_V4_URL}/projects/34/packages/helm/stable
    - helm upgrade --install portal dt-charts/microservice --set namespace=paas-dev --set env=dev --set subDomain=app --set appName=portal --set image.repository=registry.dilligentech.com/dt/paas/nimbuz-portal-fe --set image.tag=dev --set image.pullPolicy=Always --set service.targetPort=80 --namespace paas-dev
  only:
    - dev

deploy-prod:
  stage: deploy
  image: ubuntu:latest
  when: manual
  script:
    - apt update -y && apt install jq wget curl -y
    - wget https://get.helm.sh/helm-v3.15.0-linux-amd64.tar.gz
    - tar -xvzf helm-v3.15.0-linux-amd64.tar.gz
    - mv linux-amd64/helm /usr/bin/
    - rm -rf linux-amd64
    - helm repo add --username $HELM_REGISTRY_USER --password $HELM_REGISTRY_TOKEN dt-charts ${CI_API_V4_URL}/projects/34/packages/helm/stable
    - helm upgrade --install portal dt-charts/microservice --set namespace=nimbuz-prod --set env=prod --set subDomain=app --set appName=portal --set image.repository=registry.dilligentech.com/dt/paas/nimbuz-portal-fe --set image.tag=$(jq .version package.json -r) --set image.pullPolicy=Always --set service.targetPort=80 --namespace nimbuz-prod
  only:
    - master
